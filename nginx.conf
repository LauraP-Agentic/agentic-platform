events { worker_connections 2048; }
http {
    upstream agentic {
        least_conn;
        server api:8000;
    }
    server {
        listen 80;
        location / {
            proxy_pass http://agentic;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $request_id;
        }
    }
}