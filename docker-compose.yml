services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - agentic-net
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - agentic-net
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --loop uvloop --http httptools
    environment:
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    depends_on:
      - redis
      - qdrant
    networks:
      - agentic-net
    restart: unless-stopped
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "20m"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.gateway.celery_app worker --loglevel=info --concurrency=4 --without-gossip --without-mingle --without-heartbeat
    environment:
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    depends_on:
      - redis
      - qdrant
    networks:
      - agentic-net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - agentic-net
    restart: unless-stopped

networks:
  agentic-net:
    driver: bridge

volumes:
  qdrant_data: